<!DOCTYPE html>
<html>

<head>
    <title>Clear NFT Cache</title>
</head>

<body>
    <h1>Clear NFT Cache</h1>
    <button onclick="clearCache()">Clear Cache</button>
    <div id="result"></div>

    <script>
        function clearCache() {
            try {
                localStorage.clear();
                sessionStorage.clear();

                // Also clear IndexedDB if used
                indexedDB.databases().then(dbs => {
                    dbs.forEach(db => {
                        indexedDB.deleteDatabase(db.name);
                    });
                });

                document.getElementById('result').innerHTML = '<p style="color: green;">Cache cleared! Please reload the page.</p>';

                // Reload after 1 second
                setTimeout(() => {
                    window.location.href = 'http://localhost:3000/nft/0x99576db3f507fd6c1c411699f05262bb6424bc8c/381';
                }, 1000);
            } catch (e) {
                document.getElementById('result').innerHTML = '<p style="color: red;">Error: ' + e.message + '</p>';
            }
        }
    </script>
</body>

</html>
